name: Refresh allocation data and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: google-github-actions/auth@v3
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
        with:
          workload_identity_provider: ${{ vars.ALLOCATION_CLOUD_PROVIDER }}
          service_account: allocation-pages-runner@project-0dccbc1e-1212-4a3d-bcc.iam.gserviceaccount.com
          project_id: project-0dccbc1e-1212-4a3d-bcc
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
      - name: Execute Cloud Run refresh
        if: vars.ALLOCATION_CLOUD_PROVIDER != '' && github.event_name != 'push'
        run: gcloud run jobs execute us-stock-weekly-refresh --project project-0dccbc1e-1212-4a3d-bcc --region asia-northeast3 --wait
      - name: Load Cloud Run output
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
        run: |
          gcloud storage cp gs://project-0dccbc1e-1212-4a3d-bcc-allocation-feed/allocation-refresh.json "$RUNNER_TEMP/allocation-refresh.json"
          python - "$RUNNER_TEMP/allocation-refresh.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          bundle = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          files = ("simulation-history.json", "fx.json", "market-charts.json")
          if set(bundle) != set(files) or any(not isinstance(bundle[name], dict) for name in files):
              raise SystemExit("Unexpected Cloud Run output")
          for name in files:
              Path("asset-allocation", name).write_text(
                  json.dumps(bundle[name], allow_nan=False), encoding="utf-8"
              )
          PY
      - uses: actions/setup-python@v5
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements-history.txt
      - name: Install pinned collector dependencies
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python -m pip install -r automation/requirements-history.txt
      - name: Collect completed months and recent FX
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: |
          python automation/update_historical_prices.py --config automation/historical_prices.json --output asset-allocation/simulation-history.json --fx-output asset-allocation/fx.json
      - name: Refresh hourly USD KRW
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python automation/update_fx.py --output asset-allocation/fx.json
      - name: Refresh market chart series
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python automation/update_market_charts.py --config automation/market_charts.json --output asset-allocation/market-charts.json
      - name: Refresh official 13F and PTR disclosures
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/disclosures/automation"
          cp automation/update_institutional_disclosures.py "$RUNNER_TEMP/disclosures/automation/"
          snapshot="$RUNNER_TEMP/disclosures/institutional-disclosures.json"
          if ! timeout 180s python "$RUNNER_TEMP/disclosures/automation/update_institutional_disclosures.py" --output "$snapshot"; then
            echo "::warning::Official disclosures collection failed. Published snapshot retained."
            exit 0
          fi
          python - "$snapshot" <<'PY'
          import json
          import sys
          from pathlib import Path

          new = Path(sys.argv[1])
          public = Path("asset-allocation/institutional-disclosures.json")
          snapshot = json.loads(new.read_text(encoding="utf-8"))
          previous = json.loads(public.read_text(encoding="utf-8"))
          if snapshot["asOfDate"] < previous["asOfDate"]:
              print("::warning::Published disclosures are newer. Snapshot retained.")
          elif snapshot.get("collectionErrors") or {
              row["id"] for row in snapshot["targets"] if row["status"] != "UNAVAILABLE"
          } != {"buffett", "druckenmiller", "thiel", "ackman", "nps", "fisher", "pelosi"}:
              print("::warning::Incomplete disclosures. Published snapshot retained.")
          else:
              public.write_bytes(new.read_bytes())
          PY
      - uses: actions/configure-pages@v5
      - name: Prepare existing static site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='automation' --exclude='_site' --exclude='gha-creds-*.json' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
