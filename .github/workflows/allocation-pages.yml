name: Refresh allocation data and deploy Pages
on:
  workflow_run:
    workflows: ['pages-build-deployment', 'pages build and deployment']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements-history.txt
      - name: Install pinned collector dependencies
        run: python -m pip install -r automation/requirements-history.txt
      - name: Collect completed months and recent FX
        run: >-
          python automation/update_historical_prices.py
          --config automation/historical_prices.json
          --output asset-allocation/simulation-history.json
          --fx-output asset-allocation/fx.json
      - uses: actions/configure-pages@v5
      - name: Prepare existing static site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='automation' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
