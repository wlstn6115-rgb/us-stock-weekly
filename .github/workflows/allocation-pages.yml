name: Refresh allocation data and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: google-github-actions/auth@v3
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
        with:
          workload_identity_provider: ${{ vars.ALLOCATION_CLOUD_PROVIDER }}
          service_account: allocation-pages-runner@project-0dccbc1e-1212-4a3d-bcc.iam.gserviceaccount.com
          project_id: project-0dccbc1e-1212-4a3d-bcc
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
      - name: Execute Cloud Run refresh
        if: vars.ALLOCATION_CLOUD_PROVIDER != '' && github.event_name != 'push'
        run: gcloud run jobs execute us-stock-weekly-refresh --project project-0dccbc1e-1212-4a3d-bcc --region asia-northeast3 --wait
      - name: Load Cloud Run output
        if: vars.ALLOCATION_CLOUD_PROVIDER != ''
        run: |
          gcloud storage cp gs://project-0dccbc1e-1212-4a3d-bcc-allocation-feed/allocation-refresh.json "$RUNNER_TEMP/allocation-refresh.json"
          python - "$RUNNER_TEMP/allocation-refresh.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          bundle = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          files = ("simulation-history.json", "fx.json", "market-charts.json")
          if set(bundle) != set(files) or any(not isinstance(bundle[name], dict) for name in files):
              raise SystemExit("Unexpected Cloud Run output")
          for name in files:
              Path("asset-allocation", name).write_text(
                  json.dumps(bundle[name], allow_nan=False), encoding="utf-8"
              )
          PY
      - uses: actions/setup-python@v5
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements-history.txt
      - name: Install pinned collector dependencies
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python -m pip install -r automation/requirements-history.txt
      - name: Collect completed months and recent FX
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: |
          python automation/update_historical_prices.py --config automation/historical_prices.json --output asset-allocation/simulation-history.json --fx-output asset-allocation/fx.json
      - name: Refresh hourly USD KRW
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python automation/update_fx.py --output asset-allocation/fx.json
      - name: Refresh market chart series
        if: vars.ALLOCATION_CLOUD_PROVIDER == ''
        run: python automation/update_market_charts.py --config automation/market_charts.json --output asset-allocation/market-charts.json
      - name: Refresh Ver2 from TradingView, FRED and CNN
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python automation/ver2/scripts/refresh_cloud_ver2.py . --preserve
          else
            python -m pip install -r automation/ver2/requirements.txt
            if ! timeout 240s python automation/ver2/scripts/refresh_cloud_ver2.py .; then
              echo "::warning::Ver2 refresh failed. Preserving last public observations."
              python automation/ver2/scripts/refresh_cloud_ver2.py . --preserve
            fi
          fi
      - name: Refresh official 13F and PTR disclosures
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/disclosures/automation"
          cp automation/update_institutional_disclosures.py "$RUNNER_TEMP/disclosures/automation/"
          snapshot="$RUNNER_TEMP/disclosures/institutional-disclosures.json"
          status=0
          timeout 180s python "$RUNNER_TEMP/disclosures/automation/update_institutional_disclosures.py" --output "$snapshot" || status=$?
          if [[ ! -s "$snapshot" || ( "$status" != 0 && "$status" != 2 ) ]]; then
            echo "::warning::Disclosures collector returned no usable snapshot. Published snapshot retained."
            exit 0
          fi
          python - "$snapshot" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          new = Path(sys.argv[1])
          public = Path("asset-allocation/institutional-disclosures.json")
          snapshot = json.loads(new.read_text(encoding="utf-8"))
          previous = json.loads(public.read_text(encoding="utf-8"))
          ids = {"buffett", "druckenmiller", "thiel", "ackman", "nps", "fisher", "pelosi"}
          rows = snapshot["targets"]
          if len(rows) != len(ids) or {row["id"] for row in rows} != ids:
              raise SystemExit("Unexpected disclosures targets")
          if datetime.fromisoformat(snapshot["generatedAt"]) < datetime.fromisoformat(previous["generatedAt"]):
              print("::warning::Published disclosures are newer. Snapshot retained.")
              raise SystemExit(0)
          old_rows = {row["id"]: row for row in previous["targets"]}
          refreshed = 0
          for i, row in enumerate(rows):
              old = old_rows[row["id"]]
              older_filing = (row.get("filingDate") or "") < (old.get("filingDate") or "")
              if row["status"] == "UNAVAILABLE" or older_filing:
                  rows[i] = old
                  print(f"::warning::{row['id']}: published filing retained.")
              else:
                  refreshed += 1
          if refreshed:
              snapshot["collectionErrors"] = [
                  {"id": row["id"], "error": "Official source lookup failed; previous filing retained"}
                  for row in snapshot.get("collectionErrors", [])
              ]
              public.write_text(json.dumps(snapshot, ensure_ascii=False), encoding="utf-8")
          PY
      - name: Configure optional public market API
        env:
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          url = os.environ["MARKET_API_URL"].strip().rstrip("/")
          if url:
              parsed = urlparse(url)
              if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".run.app") or parsed.path or parsed.username or parsed.query or parsed.fragment:
                  raise SystemExit("MARKET_API_URL must be a Cloud Run HTTPS origin")
              Path("asset-allocation/market-api-config.js").write_text(
                  "globalThis.PUBLIC_MARKET_API_URL = " + json.dumps(url) + ";\n",
                  encoding="utf-8",
              )
          PY
      - name: Collect cloud briefing data and connect the renderer
        run: |
          script=automation/ver2/scripts/refresh_briefing.py
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python "$script" index.html briefing-data.json --preserve
          else
            python -m pip install -r automation/ver2/requirements.txt beautifulsoup4==4.15.0
            if ! timeout 300s python "$script" index.html briefing-data.json; then
              echo "::warning::Briefing source refresh failed. Preserving published briefing."
              python "$script" index.html briefing-data.json --preserve
            fi
          fi
          python automation/ver2/scripts/connect_briefing.py index.html
      - uses: actions/configure-pages@v5
      - name: Prepare existing static site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='automation' --exclude='_site' --exclude='gha-creds-*.json' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
